name: GuardDeploy Security Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    name: IaC + Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GuardDeploy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          skip-setup: false
          scanners: "vuln"
          format: "table"
          exit-code: "0" # GuardDeploy's own gate decides pass/fail, not this step

      - name: Run GuardDeploy scan
        id: guarddeploy
        run: |
          python -m guarddeploy.cli \
            --terraform-dir ./fixtures/terraform \
            --fs . \
            --project-name "${{ github.repository }} — PR #${{ github.event.number || 'push' }}" \
            --output-dir ./guarddeploy-report \
            --fail-on CRITICAL
        continue-on-error: true

      - name: Upload evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guarddeploy-evidence-report
          path: guarddeploy-report/
          retention-days: 90

      - name: Enforce security gate
        if: steps.guarddeploy.outcome == 'failure'
        run: |
          echo "::error::GuardDeploy security gate failed — critical findings present. See the guarddeploy-evidence-report artifact."
          exit 1
