[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guarddeploy"
version = "0.1.0"
description = "Cloud DevSecOps scanning that outputs audit evidence, not just pass/fail."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "checkov>=3.2",
    "jinja2>=3.1",
    "pytest>=8.0",
]

[project.scripts]
guarddeploy = "guarddeploy.cli:main"

[tool.setuptools]
packages = ["guarddeploy"]
